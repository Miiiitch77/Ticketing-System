<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exit Parking</title>
    <style>
    body { background-color: #181818; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; text-align: center; }
    .form-container { margin: 48px auto; width: 420px; background: #222; padding: 40px; border-radius: 18px; box-shadow: 0 4px 32px rgba(255,152,0,0.12); }
    label { display: block; margin-top: 24px; font-weight: 700; color: #ff9800; font-size: 1.08em; text-align: left; }
    input { width: 100%; padding: 12px; border: 2px solid #ff9800; border-radius: 6px; margin-top: 6px; font-size: 1.08em; background: #222; color: #fff; }
    button { margin-top: 28px; padding: 16px 36px; background: #ff9800; color: #222; border: none; border-radius: 8px; cursor: pointer; font-size: 1.2em; font-weight: 700; box-shadow: 0 2px 8px rgba(255,152,0,0.12); transition: background 0.2s, color 0.2s; }
    button:hover { background: #222; color: #ff9800; }
    .message { margin-top: 28px; font-size: 1.2em; color: #ff9800; background: #222; padding: 18px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(255,152,0,0.08); }
    a { color: #ff9800; font-weight: 700; text-decoration: none; margin-top: 32px; display: inline-block; font-size: 1.1em; }
    a:hover { color: #fff; background: #ff9800; padding: 6px 18px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <a href="{% url 'car_registration' %}">Register Car</a>
        <a href="{% url 'contact_help' %}">Contact & Help</a>
    </div>
    <div class="container">
        <h1 style="color:#ff9800;">Exit Parking</h1>
        <div class="form-container">
            <form method="post">
                {% csrf_token %}
                {{ form.registration_number.label_tag }}
                {{ form.registration_number }}
                <button type="submit">Validate Exit</button>
            </form>
            {% if message %}
                <div class="message">{{ message }}</div>
            {% endif %}
        </div>
        <a href="/" class="button">Back to Home</a>
    </div>
</body>
</html>
